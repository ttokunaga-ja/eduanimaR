name: repo / verify

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'contracts/**'
      - 'Makefile'
      - '.gitignore'
      - 'scripts/verify-lock-policy.sh'
      - 'docs/DEPENDENCY_LOCK_POLICY.md'
      - '.github/workflows/repo-verify.yml'
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/professor/go.mod
          cache-dependency-path: apps/professor/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run unified verify
        run: make verify
