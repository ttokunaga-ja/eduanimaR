name: librarian / quality

on:
  pull_request:
    paths:
      - 'apps/librarian/**'
      - '.github/workflows/librarian-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/librarian/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/librarian

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Run tests
        run: make test
