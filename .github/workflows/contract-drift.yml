name: contract-drift

# contracts/ の変更、または codegen 関連設定の変更時に実行
# 目的: OpenAPI/Proto の codegen 実行可能性と Proto breaking change を検証する
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'apps/web/orval.config.*'
      - 'apps/web/src/shared/api/**'
      - 'apps/web/gen/openapi/**'
      - 'apps/professor/buf.gen.yaml'
      - '.github/workflows/contract-drift.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. OpenAPI → TypeScript 生成コードの実行検証
  # ────────────────────────────────────────────────────────────
  openapi-codegen:
    name: OpenAPI codegen smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate API client from contracts/openapi/professor.yaml
        run: npm run api:generate

      - name: Verify web codegen paths
        run: npm run api:guard

      - name: Ensure code generation produced output
        run: |
          test -d gen/openapi/web/generated
          test -n "$(find gen/openapi/web/generated -type f | head -n 1)"
          echo "✅ OpenAPI codegen output exists."

  # ────────────────────────────────────────────────────────────
  # 2. Professor Proto codegen の実行検証
  # ────────────────────────────────────────────────────────────
  professor-proto-codegen:
    name: Professor proto codegen smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Generate Go proto code
        run: |
          cd apps/professor
          buf generate
          test -d gen/proto
          test -n "$(find gen/proto -type f | head -n 1)"
          echo "✅ Professor proto codegen output exists."

  # ────────────────────────────────────────────────────────────
  # 3. Librarian Proto codegen の実行検証
  # ────────────────────────────────────────────────────────────
  librarian-proto-codegen:
    name: Librarian proto codegen smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install grpcio-tools
        run: |
          python -m pip install --upgrade pip
          pip install grpcio-tools

      - name: Generate Python proto code
        run: |
          cd apps/librarian
          make proto
          test -f gen/proto/python/librarian/v1/librarian_pb2.py
          test -f gen/proto/python/librarian/v1/librarian_pb2_grpc.py
          echo "✅ Librarian proto codegen output exists."

  # ────────────────────────────────────────────────────────────
  # 4. Proto breaking change チェック
  # ────────────────────────────────────────────────────────────
  proto-breaking:
    name: Proto breaking change check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Proto lint
        run: buf lint contracts/proto

      - name: Proto breaking change check (vs. main branch)
        run: |
          buf breaking contracts/proto \
            --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main,subdir=contracts/proto" \
            || (echo "❌ Breaking change detected in contracts/proto/!" && exit 1)
          echo "✅ No proto breaking changes."
