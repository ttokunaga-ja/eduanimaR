name: web / i18n check

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/locales/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/locales/**'

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Extract i18n keys
        run: npm run i18n:extract
      - name: i18n check
        run: npm run i18n:check
      - name: Lint
        run: npm run lint
